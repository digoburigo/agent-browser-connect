name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mock-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic suite
        run: bash tests/run.sh
